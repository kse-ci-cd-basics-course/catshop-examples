# Step 2 — a second container. Note what is NOT here: a volume.
name: catshop-step2
services:
  app:
    build: .
    image: catshop:step2
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Setting DATABASE_URL is the entire change in the application.
      # `db` is a hostname that only exists because Compose made a network for us —
      # step 5 is where we stop taking that for granted.
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/shop
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # We mount nothing at the data directory. That does NOT mean the data lands in the
    # container's writable layer: the postgres image declares VOLUME /var/lib/postgresql/data,
    # so Docker satisfies it with a fresh ANONYMOUS volume (a random hex name). Nothing ever
    # reuses it, so `down` + `up` gets a brand-new empty one and the old rows are orphaned.
    # Verify with:  docker inspect <db> --format '{{range .Mounts}}{{.Type}} {{.Name}}{{end}}'
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s
