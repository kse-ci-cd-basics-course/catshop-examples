# Step 3 — the same stack, plus the three lines that keep the data.
name: catshop-step3
services:
  app:
    build: .
    image: catshop:step3
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Setting DATABASE_URL is the entire change in the application.
      # `db` is a hostname that only exists because Compose made a network for us —
      # step 5 is where we stop taking that for granted.
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/shop
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # A NAMED volume: Docker manages it, it lives outside the container, and it
      # survives `down`. postgres:18+ moved the layout — mount /var/lib/postgresql there.
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
