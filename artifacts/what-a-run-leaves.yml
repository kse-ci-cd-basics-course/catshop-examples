# What outlives a deleted job.
#
#   artifact   this run's id, a few weeks. Evidence.
#   registry   a name, from anywhere, until deleted. A deliverable.
#
# The image goes in a tarball, and a later job loads it. Nothing published.
name: 13 · artifacts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci-base-app/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: ci-base-app

      # --junitxml is the machine-readable one: every CI tool on earth reads it.
      # --cov-report=html is the one a human opens. Produce both; they are read
      # by different readers.
      - name: run the suite, and write down what happened
        working-directory: ci-base-app
        run: |
          python -m pytest tests \
            --junitxml=reports/junit.xml \
            --cov=app --cov-report=html:reports/coverage --cov-report=term

      - name: put the headline on the run's summary page
        if: always()
        working-directory: ci-base-app
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          s = ET.parse("reports/junit.xml").getroot()
          if s.tag == "testsuites": s = s[0]
          print("| tests | failures | errors | seconds |")
          print("|---|---|---|---|")
          print("| {tests} | {failures} | {errors} | {time} |".format(**s.attrib))
          PY

      # `if: always()` matters more here than anywhere: the report is most
      # valuable exactly when the suite went red, and the default is success()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: ci-base-app/reports/junit.xml
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-html
          path: ci-base-app/reports/coverage
          retention-days: 14

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # not pushed anywhere. `outputs: type=docker,dest=` writes the image to a
      # file instead of a registry — on a pull request there is nothing to
      # publish yet, and nobody outside this run needs to pull it.
      - uses: docker/build-push-action@v6
        with:
          context: ci-base-app
          tags: catshop:${{ github.sha }}
          outputs: type=docker,dest=/tmp/catshop.tar

      - run: ls -lh /tmp/catshop.tar

      - uses: actions/upload-artifact@v4
        with:
          name: image-tar
          path: /tmp/catshop.tar
          retention-days: 3        # it is big, and it is not a deliverable

  # the point of the whole file: a later job can have the image back, without
  # anything having been published
  smoke:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-tar
          path: /tmp

      - run: docker load --input /tmp/catshop.tar

      - name: it is the same image, on a machine that never built it
        run: |
          docker run -d --name shop -p 8080:8080 catshop:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health
