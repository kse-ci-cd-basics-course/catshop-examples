# Two units of reuse, side by side. The only file where both are visible at once.
#
#   composite action    made of STEPS.  steps: - uses: ./.github/actions/x
#                       runs in your job, on your disk, after your checkout
#   reusable workflow   made of JOBS.   jobs: <id>: uses: ./.github/workflows/x.yml
#                       its own runners, its own checkout, shares nothing
#
# Rule of thumb: repeating steps inside a job → action. Repeating whole jobs
# across repositories → workflow.
#
# Both can live somewhere else, and then you pin a version:
#
#   uses: actions/checkout@v4                        an action, by tag
#   uses: kse/shared/.github/workflows/build.yml@v1  a workflow — the PATH is
#                                                    part of the name, and the
#                                                    @ref is not optional
#
# `actions/checkout` is a JAVASCRIPT action, not a composite one: the three
# kinds differ only in what `runs:` says — node20, docker, or composite.
name: 15 · using both

on: workflow_dispatch

jobs:
  # the composite action, used the way you use anybody else's action
  with-an-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # the action needs the code to be here

      - id: suite
        uses: ./.github/actions/install-and-test
        with:
          python-version: '3.12'

      - run: echo "it reported ${{ steps.suite.outputs.tests }}"

  # the reusable workflow. No `steps:`, no `runs-on:` — this job IS the call.
  # a path means this repository, at this commit. From another repository it
  # would be  kse/shared/.github/workflows/build.yml@v1  — tagged, so a change
  # over there cannot alter what runs here until you move the tag.
  with-a-workflow:
    uses: ./.github/workflows/_build-and-test.yml
    with:
      image: ghcr.io/example/catshop
      tag: demo
      publish: false
    secrets: inherit

  # and it hands values back, the same way a job does
  after:
    needs: with-a-workflow
    runs-on: ubuntu-latest
    steps:
      - run: echo "built ${{ needs.with-a-workflow.outputs.digest }}"
