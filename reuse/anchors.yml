# `&` defines, `*` repeats. Resolved before GitHub reads a key.
# An anchor never leaves its file, which is why it is the wrong fix for
# chapter 03 and a composite action is the right one.
# Defined on first use: Actions rejects a top-level key it does not know.
name: 11 · anchors and aliases

on: workflow_dispatch

jobs:
  lint:
    runs-on: &runner ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v4

      - &python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci-base-app/requirements*.txt

      - run: python -m compileall ci-base-app

  test:
    runs-on: *runner          # the same label, written once
    steps:
      - *checkout             # the same step, written once
      - *python
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: ci-base-app
      - run: python -m pytest tests -q
        working-directory: ci-base-app
