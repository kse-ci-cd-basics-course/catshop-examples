# by hand: docker/login-action
#
# The action is four lines of shell. What is worth the slide is not the login,
# it is WHERE the credential came from and what it is allowed to do.
name: by-hand-login

on: { workflow_dispatch: }

permissions:
  contents: read
  packages: write        # take this line out and the push below answers 403

jobs:
  the-action:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  by-hand:
    runs-on: ubuntu-latest
    steps:
      - name: the whole action
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # --password-stdin and not --password: an argument is visible in
          # `ps`, in the shell history and in any crash dump of this step.

      - name: what login left on disk
        run: |
          cat ~/.docker/config.json
          # the "auth" field is BASE64, not encryption. Anyone who can read
          # this file can read the token. That is fine here because the token
          # dies with the run - and it is exactly why a long-lived personal
          # access token in this position is a bad idea.
          jq -r '.auths["ghcr.io"].auth' ~/.docker/config.json | base64 -d | cut -d: -f1

      - name: and what the registry gives back for it
        run: |
          # docker never sends that token to the registry. It exchanges it for
          # a short-lived bearer token, scoped to one repository and one verb.
          curl -s -u "$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${GITHUB_REPOSITORY,,}:pull,push" \
            | jq -r '.token' | cut -c1-24
          echo "...that is the thing the push is actually authorised by"

  # The trust model, which is the reason this file exists:
  #
  #   a pull_request from a FORK gets a token with read-only contents and NO
  #   secrets - secrets.GITHUB_TOKEN is still there, secrets.ANYTHING_ELSE is
  #   empty. So the login succeeds and the push fails, by design.
  #
  # Same rule as the cache: a low-trust trigger gets read access and not write.
  # Neither is a bug, and a workflow that works around it is the bug.
  what-a-fork-gets:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "event          $GITHUB_EVENT_NAME"
          echo "ref protected  $GITHUB_REF_PROTECTED"
          echo "a secret that is not GITHUB_TOKEN, length only:"
          echo -n '${{ secrets.NOT_SET_ON_PURPOSE }}' | wc -c
