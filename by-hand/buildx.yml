# by hand: the layer cache, and where it actually lives
#
# setup-buildx-action installs a BUILDER; build-push-action assembles one long
# `docker buildx build` line. Neither is magic, and neither hides the cache:
#
#   type=gha       entries in the same cache service actions/cache uses,
#                  listable through /repos/{owner}/{repo}/actions/caches
#   type=registry  an ordinary OCI artifact in your registry, which you can
#                  fetch with curl like any other manifest
#
# Both are checked here, by hand, after the build.
name: by-hand-buildx

on: { workflow_dispatch: }

permissions:
  contents: read
  actions: read            # to list the cache entries buildkit wrote
  packages: write          # for the registry-backed cache

jobs:
  the-default-builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: why setup-buildx exists at all
        run: |
          docker buildx version
          docker buildx ls | head -5
          # the default `docker` driver cannot export a cache. That is the
          # whole reason the setup action is in everybody's workflow.

  gha-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: a builder that can export a cache
        run: |
          docker buildx create --name course --driver docker-container --use
          docker buildx inspect --bootstrap | head -12

      - name: build, exporting the layers
        run: |
          docker buildx build ci-base-app \
            --file ci-base-app/Dockerfile \
            --tag catshop:by-hand \
            --cache-from type=gha,scope=by-hand \
            --cache-to   type=gha,scope=by-hand,mode=max \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --load

      - name: and here are the entries it wrote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the layer cache is not a special place: it is the SAME store, and
          # these are the same kind of entries actions/cache creates.
          gh api "repos/$GITHUB_REPOSITORY/actions/caches" \
            --jq '.actions_caches[] | "\(.id)\t\(.size_in_bytes)\t\(.key)"' | head -20
          echo "---"
          echo "buildkit keys look like buildkit-blob-* and index-*; yours are above."

      - name: run it twice and count what was reused
        run: |
          docker buildx build ci-base-app --file ci-base-app/Dockerfile \
            --cache-from type=gha,scope=by-hand --tag catshop:again --load 2>&1 \
            | tee /tmp/second.log | tail -20
          echo "CACHED steps: $(grep -c 'CACHED' /tmp/second.log)"

  registry-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: build, with the cache in the registry instead
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          NAME="${GITHUB_REPOSITORY,,}/catshop"
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          docker buildx build ci-base-app \
            --file ci-base-app/Dockerfile \
            --cache-from "type=registry,ref=ghcr.io/$NAME:buildcache" \
            --cache-to   "type=registry,ref=ghcr.io/$NAME:buildcache,mode=max" \
            --tag "ghcr.io/$NAME:${GITHUB_SHA}" --push

      - name: the cache is just a manifest — read it with curl
        run: |
          TOKEN=$(curl -sS -u "$GITHUB_ACTOR:${{ secrets.GITHUB_TOKEN }}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:$NAME:pull" | jq -r .token)
          curl -sS -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/$NAME/manifests/buildcache" \
            | jq '{mediaType, layers: (.layers // [] | length), annotations: (.annotations // {} | keys)}'
          # No quota to run out of and no 7-day eviction - it is your registry.
          # It costs a push, and it needs a login, which type=gha does not.
