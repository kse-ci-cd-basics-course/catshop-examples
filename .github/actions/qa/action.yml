# One QA pack, three environments. The environment decides what runs.
#
# Nothing is really deployed yet, so each step says what it would check. The
# shape is the lesson: one shared action, a step-level `if:` on an input, and
# no copy of it per environment.
name: qa
description: Run the checks that suit this environment

inputs:
  environment:
    description: sandbox · stage · production
    required: true
  host:
    description: the base URL this environment runs at
    required: true

runs:
  using: composite
  steps:
    # a missing variable is an EMPTY STRING, not an error — so say it here,
    # where the message is readable
    - name: the host has to be set
      shell: bash
      run: |
        if [ -z "${{ inputs.host }}" ]; then
          echo "::error::APP_HOST is not set on the '${{ inputs.environment }}' environment"
          exit 1
        fi

    - name: smoke
      shell: bash
      run: echo "GET ${{ inputs.host }}/health  ·  /ready"

    - name: contract
      if: inputs.environment != 'production'
      shell: bash
      run: echo "POST ${{ inputs.host }}/visits — this one writes, so not in production"

    - name: end-to-end
      if: inputs.environment == 'stage'
      shell: bash
      run: echo "42 scenarios against ${{ inputs.host }}, with the real partner"

    - name: production checks
      if: inputs.environment == 'production'
      shell: bash
      run: echo "GET ${{ inputs.host }}/price/MK-II — read-only. Nothing writes to production"

    - shell: bash
      run: echo "qa ${{ inputs.environment }} — ok" >> "$GITHUB_STEP_SUMMARY"
