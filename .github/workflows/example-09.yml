# Step 9 — what can start a run, and the two things people get wrong.
#
# Four triggers you will actually use, plus one that does not come from a commit
# at all. Read the `on:` block; the jobs underneath only report which one fired.
name: example-09

on:
  # 1 · it LANDED on main. This is the release path.
  push:
    branches: [main]
    paths: ['9-ci-events/**', '.github/workflows/example-09.yml']

  # 2 · somebody PROPOSES a change. A different event, not the same push twice —
  #     and the reason `push` + `pull_request` together runs a PR branch twice.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths: ['9-ci-events/**', '.github/workflows/example-09.yml']

  # 3 · the thing nobody remembers to do. Cron is UTC and there is no timezone
  #     field, which is why "it ran an hour early" happens every autumn.
  schedule:
    - cron: '0 3 * * *'

  # 4 · a human presses the button.
  workflow_dispatch:
    inputs:
      reason:
        description: 'why are you running this by hand'
        type: string
        default: 'because I can'

  # 5 · NOT a commit. Anything that can make an authenticated POST can start
  #     this — a data lake, a feature store, another repository's pipeline.
  #
  #     curl -X POST \
  #       -H "Accept: application/vnd.github+json" \
  #       -H "Authorization: Bearer $TOKEN" \
  #       https://api.github.com/repos/OWNER/REPO/dispatches \
  #       -d '{"event_type":"dataset-published",
  #            "client_payload":{"dataset":"orders","rows":128400}}'
  repository_dispatch:
    types: [dataset-published]

permissions:
  contents: read

defaults:
  run:
    working-directory: 9-ci-events

jobs:
  why:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: which subscription delivered this run
        run: |
          echo "event  ${{ github.event_name }}"
          echo "ref    ${{ github.ref_name }}"
          echo "action ${{ github.event.action }}"

      # "Merge" is not an event. Merging a pull request IS a push to the base
      # branch — which is why this reports `push`, not `merge`, and why there is
      # no `on: merge` to subscribe to.
      - name: was this a merged pull request
        if: github.event_name == 'push'
        run: |
          echo "pushed by      ${{ github.event.pusher.name }}"
          echo "head commit    ${{ github.event.head_commit.message }}"
          echo "a merge arrives here as a push. There is no 'on: merge'"

      - name: a proposal, not a landing
        if: github.event_name == 'pull_request'
        run: echo "PR #${{ github.event.number }} -> ${{ github.base_ref }}"

      - name: somebody pressed the button
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "reason ${{ inputs.reason }}"

      # The payload the caller sent arrives verbatim. Nobody committed anything.
      - name: something outside GitHub asked for this
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "type    ${{ github.event.action }}"
          echo "dataset ${{ github.event.client_payload.dataset }}"
          echo "rows    ${{ github.event.client_payload.rows }}"
          echo "no commit, no pull request, nobody pushed anything"
