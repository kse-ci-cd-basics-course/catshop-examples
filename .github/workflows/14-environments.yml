# The delivery pipeline. One file, two shapes, decided by what triggered it.
#
#   on main   build ─> sandbox ─> stage ─> production
#   on a PR   build ─> sandbox ─> stage              production is main only
#
# Each deploy job ends with its OWN qa run, in the same job — if the checks
# fail, the deploy job is red, and the next environment never starts. The gate
# is the plain `needs:`, which carries an implicit `&& success()`.
#
# The qa steps are one shared composite action that takes the environment as an
# input, instead of three near-identical jobs: .github/actions/qa
#
# Environments to create: ENVIRONMENTS.md
name: 14 · delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/install-and-test        # unit tests
      - run: docker build -t catshop:${{ github.sha }} ci-base-app

  sandbox:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: sandbox
      url: ${{ vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v4                      # the qa action needs the repo
      - run: echo "deploying ${{ needs.build.outputs.tag }} to ${{ vars.APP_HOST }}"
      - uses: ./.github/actions/qa
        with:
          environment: sandbox
          host: ${{ vars.APP_HOST }}

  stage:
    needs: sandbox            # red qa in sandbox, and this never starts
    runs-on: ubuntu-latest
    environment:
      name: stage
      url: ${{ vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "deploying ${{ needs.build.outputs.tag }} to ${{ vars.APP_HOST }}"
      - uses: ./.github/actions/qa
        with:
          environment: stage
          host: ${{ vars.APP_HOST }}

  production:
    needs: [build, stage]
    if: github.ref == 'refs/heads/main'      # a pull request stops at stage
    runs-on: ubuntu-latest
    # the required reviewer lives on the environment, not here
    environment:
      name: production
      url: ${{ vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "deploying ${{ needs.build.outputs.tag }} to ${{ vars.APP_HOST }}"
      - uses: ./.github/actions/qa
        with:
          environment: production
          host: ${{ vars.APP_HOST }}
