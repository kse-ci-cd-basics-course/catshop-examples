# THE PIPELINE — half one: every pull request.
#
# This is the finished thing, not a chapter: test, build the image to prove it
# still builds, run QA, and check the infrastructure change the same way.
# Nothing is published from a pull request, and nothing is applied without
# somebody pressing a button.
#
# No cache anywhere in here on purpose — add one once you have read
# ../../topics/cache-*.yml and ../../pipeline/10-cache-deps.
name: pull request

on:
  pull_request:
    paths:
      - "app/**"
      - "terraform/3-gcp-github-oidc/**"
      - ".github/workflows/pull-request.yml"
      - ".github/actions/**"

# one run per pull request: a new push cancels the previous run
concurrency:
  group: pr-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  # Only so the terraform jobs can mint a token for Google. It is opt-in per
  # workflow and the default is no credential.
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-and-test
        with:
          working-directory: app

  image:
    needs: test                 # a red suite cannot reach the build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: app
          push: false           # a pull request builds and stops
          load: true
          tags: catshop:pr-${{ github.event.pull_request.number }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: it starts, and it answers
        run: |
          docker run -d --name pr -p 8080:8080 catshop:pr-${{ github.event.pull_request.number }}
          for _ in $(seq 30); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health

  qa:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/qa
        with:
          environment: sandbox
          host: ${{ vars.APP_HOST }}

  # ── the infrastructure change, checked but not made ─────────────────────────
  #
  # One definition of plan-and-maybe-apply, called with apply: false. There is
  # no apply job in this workflow at all — not even one waiting for approval,
  # because a job that waits is still a job that started by itself. Deploying a
  # branch is deploy-branch.yml, and a person has to press it.
  terraform:
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: false
