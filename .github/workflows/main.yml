# THE PIPELINE — half two: a merge to main.
#
# A merge is a different event, on a different commit, and it is the only one
# allowed to publish. Test, build, push to GHCR, QA against what was published
# — by DIGEST, so what QA checked is what was shipped — and then deploy that
# same digest.
#
# No cache anywhere in here on purpose — add one once you have read
# ../../topics/cache-*.yml and ../../pipeline/10-cache-deps.
name: main

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "terraform/3-gcp-github-oidc/**"
      - ".github/workflows/main.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: main          # merges queue; they never overtake each other
  cancel-in-progress: false

permissions:
  contents: read
  # The deploy job mints a token to present to Google. It is opt-in per
  # workflow and the default is no credential, which is the right default.
  id-token: write
  packages: write      # without this the push answers 403

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-and-test
        with:
          working-directory: app

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      # the one name that cannot be moved underneath whoever pulls it later
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # the login is inside the job because the job is the only thing that
      # exists. GITHUB_TOKEN is minted for this run and dies with it.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}   # never `latest`
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - run: |
          echo "published ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"

  qa:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pull exactly what was published
        run: |
          REF="${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}"
          docker pull -q "$REF"
          docker run -d --name app -p 8080:8080 "$REF"
          for _ in $(seq 30); do curl -fsS localhost:8080/health && break; sleep 1; done

      - uses: ./.github/actions/qa
        with:
          environment: sandbox
          host: http://localhost:8080

  # ── deploy ──────────────────────────────────────────────────────────────────
  #
  # The digest QA just checked is the digest deployed — not the tag it was
  # pushed under, and not a fresh build. Automatic here: the merge was the
  # decision, and `production` still holds it for a reviewer.
  deploy:
    needs: [publish, qa]
    uses: ./.github/workflows/_terraform.yml
    with:
      apply: true
      environment: production
      image: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
