# THE PIPELINE — half two: a merge to main.
#
# A merge is a different event, on a different commit, and it is the only one
# allowed to publish. Test, build, push to GHCR, QA against what was published
# — by DIGEST, so what QA checked is what was shipped — and then deploy that
# same digest.
#
# No cache anywhere in here on purpose — add one once you have read
# ../../topics/cache-*.yml and ../../pipeline/10-cache-deps.
name: main

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "terraform/3-gcp-github-oidc/**"
      - ".github/workflows/main.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: main          # merges queue; they never overtake each other
  cancel-in-progress: false

permissions:
  contents: read
  # The deploy job mints a token to present to Google. It is opt-in per
  # workflow and the default is no credential, which is the right default.
  id-token: write
  packages: write      # without this the push answers 403

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/install-and-test
        with:
          working-directory: app

  publish:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      # the one name that cannot be moved underneath whoever pulls it later
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # the login is inside the job because the job is the only thing that
      # exists. GITHUB_TOKEN is minted for this run and dies with it.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}   # never `latest`
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - run: |
          echo "published ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}" \
            >> "$GITHUB_STEP_SUMMARY"

  qa:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pull exactly what was published
        run: |
          REF="${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}"
          docker pull -q "$REF"
          docker run -d --name app -p 8080:8080 "$REF"
          for _ in $(seq 30); do curl -fsS localhost:8080/health && break; sleep 1; done

      - uses: ./.github/actions/qa
        with:
          environment: sandbox
          host: http://localhost:8080

  # ── deploy ──────────────────────────────────────────────────────────────────
  #
  # The digest QA just checked is the digest that gets deployed. Not the tag it
  # was pushed under, and not a fresh build: the same bytes, all the way down.
  #
  # Nothing is stored for this. The job asks GitHub for a short-lived token,
  # Google trades it for an hour of credentials, and the run ends with no
  # credential anywhere. See ../../terraform/3-gcp-github-oidc/README.md for the one-time
  # trust setup — and for why the attribute condition on it is not optional.
  deploy:
    needs: [publish, qa]
    runs-on: ubuntu-latest
    environment: production     # a person opens this gate
    defaults:
      run:
        working-directory: terraform/3-gcp-github-oidc
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      # The image is passed IN, never looked up. A lookup is a question asked
      # at plan time whose answer can change before apply.
      TF_VAR_image: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -out=tfplan
      - run: terraform apply -input=false tfplan

      - name: it answers on the public address
        run: |
          url="$(terraform output -raw url)"
          echo "deployed: $url"
          # The backends are unhealthy until the instances have pulled the
          # image and /health has replied twice, so this waits rather than
          # declaring failure on the first 502.
          for _ in $(seq 1 60); do
            curl -fsS -m 5 "$url/health" && break
            sleep 10
          done
          curl -fsS -m 5 "$url/health"
