# 08 — two green ticks publish nothing
#
# The image built. Then the machine was deleted, and with it the image. A
# registry is the only place it exists once the job is over.
#
# NEW: permissions · docker/login-action · push as an EXPRESSION so a pull
#      request builds and never publishes · the digest as a job output
name: ci

on:
  pull_request:
  push:
    branches: [main]

# start from nothing and add the one scope that is needed. Leave this out and
# the push answers 403 - the token is real, it was minted for this run, it
# simply was never asked for the permission.
permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci-base-app/requirements*.txt
      - run: pip install -r ci-base-app/requirements.txt -r ci-base-app/requirements-dev.txt
      - run: pytest ci-base-app/tests -q

  image:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      # the digest leaves the job as a string. It is the only name that cannot
      # be moved underneath whoever pulls it later.
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # one expression decides whether this run publishes at all
      - id: meta
        run: |
          # GHCR rejects an uppercase path, and an owner may have capitals
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # the login happens INSIDE the job, because the job is the only thing
      # that exists. GITHUB_TOKEN is minted for this run and dies with it -
      # nobody created it and nobody has to rotate it.
      - if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ci-base-app
          push: ${{ steps.meta.outputs.publish }}     # a pull request builds and stops
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          # the label that ties these bytes to that commit. The grader checks it,
          # and moving a tag afterwards makes it a lie.
          labels: org.opencontainers.image.revision=${{ github.sha }}

      - if: steps.meta.outputs.publish == 'true'
        run: echo "published @${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
