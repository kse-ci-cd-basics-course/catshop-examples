# 06 — qa credentials in production
#
# One repository secret was reachable from every workflow, including the one
# somebody added on Tuesday. Group the values, not the pipeline.
#
# NEW: env at three levels · vars · secrets · environment:
name: ci

on:
  # unchanged from chapter 01: every pull request still gets tested.
  # the default is opened + synchronize + reopened, so write `types:` only when
  # you want something else — `ready_for_review` to skip drafts, `closed` to
  # tear down a preview, `labeled` to run on demand
  pull_request:

  # a typo in docs/ matches nothing here. It lands in 12-docs-pages.yml
  push:
    branches: [main]
    paths:
      - 'ci-base-app/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/_build-and-test.yml'

  workflow_dispatch:
    inputs:
      target:
        description: where to pretend to deploy
        type: choice
        options: [dev, qa, prod]
        default: dev
      dry_run:
        description: say what would happen, do nothing
        type: boolean
        default: true

  # cron is UTC. No timezone field — which is why things run an hour early in spring
  schedule:
    - cron: '17 3 * * 1'

# start from nothing. `packages: write` is what lets the image job push
env:
  APP: catshop              # every job in this file

permissions:
  contents: read
  packages: write

# push twice and the first run is cancelled, instead of two racing to publish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # a debugger, not a stage. Delete it once you have found the thing.
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: two syntaxes, two readers
        env:
          FROM_GITHUB: ${{ github.sha }}      # substituted before bash exists
        run: |
          echo "github substituted this: ${{ github.sha }}"
          echo "bash expanded this:      $FROM_GITHUB"
          echo 'bash never sees the double-brace form; github already removed it'

      - name: everything this run knows
        run: echo '${{ toJSON(github.event) }}' | head -40

      - name: a key that does not exist is EMPTY, not an error
        run: |
          echo "vars.NOPE is [${{ vars.NOPE }}]"
          echo "this is where a deploy to '' comes from"

  # decide the tag once, so every job agrees on it
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      image: ${{ steps.pick.outputs.image }}
      publish: ${{ steps.pick.outputs.publish }}
    steps:
      - id: pick
        run: |
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # GHCR rejects an uppercase path, and an owner may have capitals
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          else
            echo "publish=no" >> "$GITHUB_OUTPUT"
          fi
          # a step has no API. It appends to a file the runner reads between steps
          echo "BUILT_BY=$GITHUB_ACTOR"  >> "$GITHUB_ENV"           # every later step
          echo "$HOME/.local/bin"        >> "$GITHUB_PATH"          # on PATH from now on
          echo "### ${GITHUB_SHA::7}"    >> "$GITHUB_STEP_SUMMARY"  # the run's summary page

      - name: the next step reads them back
        run: |
          echo "output  ${{ steps.pick.outputs.tag }}"
          echo "env     $BUILT_BY"
          cat "$GITHUB_OUTPUT" "$GITHUB_ENV"

  test:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
      fail-fast: false       # otherwise 3.11 going red hides the 3.12 answer
    steps:
      - uses: actions/checkout@v4
      - id: suite
        uses: ./.github/actions/install-and-test
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.python }}
          path: ci-base-app/out.txt
          retention-days: 3

  image:
    needs: [meta, test]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: sign in, only when we intend to publish
        if: needs.meta.outputs.publish == 'yes'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}     # nobody created this one

      # a pull request builds it and never publishes it. One key.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ci-base-app
          push: ${{ needs.meta.outputs.publish == 'yes' }}
          tags: ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}
          # the label that ties the image to a commit
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    needs: [meta, image]
    if: needs.meta.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: run what we just published, BY DIGEST
        run: |
          # a tag can be moved. A digest is the bytes.
          ref='${{ needs.meta.outputs.image }}@${{ needs.image.outputs.digest }}'
          docker run -d --name shop -p 8080:8080 "$ref"
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health

      - if: failure()
        run: docker logs shop

  report:
    # `needs` is wait-for. `always()` turns off the hidden "and all green".
    needs: [meta, test, image, smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          {
            echo "| job | result |"
            echo "|---|---|"
            echo "| test | ${{ needs.test.result }} |"
            echo "| image | ${{ needs.image.result }} |"
            echo "| smoke | ${{ needs.smoke.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: only on the default branch
        if: github.ref == 'refs/heads/main'
        run: echo "published ${{ needs.meta.outputs.tag }}"

      - name: only when something above went red
        if: contains(needs.*.result, 'failure')
        run: echo "somebody has to be told"

      - name: a step with no condition at all is success() by default
        run: echo "which is why upload-artifact needs always() to survive a red build"

  deploy-qa:
    needs: [meta, smoke]
    if: needs.meta.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    environment: qa          # decides which vars and secrets exist here
    env:
      APP: catshop-worker    # every step in this job
    steps:
      - run: echo "$APP"     # catshop-worker

      - run: echo "$APP"     # catshop-probe — the step is nearer, so it wins
        env:
          APP: catshop-probe

      - name: same key names, qa's values
        run: |
          echo "host      ${{ vars.APP_HOST }}"
          echo "replicas  ${{ vars.REPLICAS }}"
          echo "image     ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.tag }}"
          # an address, not a password. The app reads the vault at startup.
          echo "vault     ${{ vars.VAULT_ROLE }}"
          echo "token len ${#TOKEN}"
        env:
          TOKEN: ${{ secrets.DEPLOY_TOKEN }}

  deploy-production:
    needs: [meta, deploy-qa]
    runs-on: ubuntu-latest
    environment: production  # same key names, different values, and a reviewer
    steps:
      - name: masking is a safety net, not a plan
        run: |
          echo "::add-mask::$(echo hunter2)"
          echo "host      ${{ vars.APP_HOST }}"
          echo "deploying ${{ needs.meta.outputs.tag }}"
