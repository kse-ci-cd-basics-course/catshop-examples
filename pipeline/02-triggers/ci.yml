# 02 — forty runs a day
#
# It runs on a README typo, on every branch, and nobody reads the
# notifications any more. `on:` is a subscription. Narrow it.
#
# NEW: branches · paths · types · workflow_dispatch · schedule
name: ci

on:
  # unchanged from chapter 01: every pull request still gets tested.
  # the default is opened + synchronize + reopened, so write `types:` only when
  # you want something else — `ready_for_review` to skip drafts, `closed` to
  # tear down a preview, `labeled` to run on demand
  pull_request:

  # a typo in docs/ matches nothing here. It lands in 12-docs-pages.yml
  push:
    branches: [main]
    paths:
      - 'ci-base-app/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/_build-and-test.yml'

  workflow_dispatch:
    inputs:
      target:
        description: where to pretend to deploy
        type: choice
        options: [dev, qa, prod]
        default: dev
      dry_run:
        description: say what would happen, do nothing
        type: boolean
        default: true

  # cron is UTC. No timezone field — which is why things run an hour early in spring
  schedule:
    - cron: '17 3 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: which subscription delivered this run
        run: |
          echo "event   ${{ github.event_name }}"
          echo "ref     ${{ github.ref_name }}"
          echo "action  ${{ github.event.action }}"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci-base-app/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: ci-base-app

      - run: python -m pytest tests -q
        working-directory: ci-base-app

  build:
    needs: test           # a broken commit is not worth a docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t catshop:${{ github.sha }} ci-base-app

      - name: the image starts, and the app inside it imports
        run: |
          docker run --rm -d --name shop -p 8080:8080 catshop:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS localhost:8080/health && break; sleep 1; done
          curl -fsS localhost:8080/health
          docker rm -f shop
